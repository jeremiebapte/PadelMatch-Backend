name: PADIMA Metrics V1 Firestore Emulator
on:
  push:
    branches: [feature/product-metrics-v1]
  workflow_dispatch:
jobs:
  firestore-emulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
        working-directory: functions
      - run: npx --yes firebase-tools@14 emulators:exec --project demo-padima-metrics-v1 --only firestore "node functions/test-product-metrics-emulator.mjs"
        env:
          CI: 'true'
